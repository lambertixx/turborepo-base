app = "mentora-rises-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.api"

[build.args]
  DATABASE_URL = "postgresql://postgres:postgres@localhost:5432/mentora?schema=public"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  CORS_ORIGIN = "https://mentora-rises-web.fly.dev,http://localhost:3000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[deploy]
  strategy = "rolling"
