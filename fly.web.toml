app = "mentora-rises-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.web"

[build.args]
  NEXT_PUBLIC_API_URL = "https://mentora-rises-api.fly.dev"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_Y2xlcmsud2VsY29tZS5zYXR5ci01Ni5sY2wuZGV2JA"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://mentora-rises-api.fly.dev"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_Y2xlcmsud2VsY29tZS5zYXR5ci01Ni5sY2wuZGV2JA"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL = "/"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[deploy]
  strategy = "rolling"
